services:
  - type: web
    name: cronify-scheduler
    runtime: docker
    plan: free
    rootDir: scheduler
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: CRONIFY_ADMIN_TOKEN
        sync: false
      - key: CRONIFY_PORT
        value: "8080"
